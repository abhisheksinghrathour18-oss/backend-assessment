services:
  postgres-shard1:
    image: postgres:16-alpine
    container_name: order-shard1
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shard1
    ports:
      - "5437:5432"
    volumes:
      - postgres-shard1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shard1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-shard2:
    image: postgres:16-alpine
    container_name: order-shard2
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shard2
    ports:
      - "5438:5432"
    volumes:
      - postgres-shard2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shard2"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-shard1-data:
  postgres-shard2-data:

